<!DOCTYPE html>
<html lang="en">
<head>
<title>Manage Society</title>
<link rel="stylesheet" type="text/css" href="static/mystyle.css">
</head>
<body>
<div class="container">

<h1>Manage Societies</h1>
<h2>Add Society</h2>
{% if msg %}
<p style="color:red;">{{ msg }}</p>
{% endif %}
<form method = "POST" action = "/manageSociety">
    <Label>Society Name:</Label>
    <input type = "text" name = "society_name" required>
    <input type = "submit" value = "Add Society">
</form>
<br/><br/>
<hr/>
<br/>

<h2>Societies</h2>
{% if societies %}
<table>
    <tr>
        <th>Society Name</th>
        <th>Number of Events</th>
    </tr>
    {% for society in societies %}
    <tr>
        <td>{{ society[0] }}</td>
        <td>{{ society[1] }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No Society Found</p>
{% endif  %}

<br/>
<a href="/index">Back to Home</a>

</div>
</body>
</html>
