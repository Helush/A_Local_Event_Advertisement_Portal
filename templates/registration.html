<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <link rel="stylesheet" type="text/css" href="static/mystyle.css">
    <script src="/static/validation.js"></script>
</head>
<body>
<h1>Register</h1>
<p id="errorcode" style="color:red"></p>
<form name="formRegistration" action="/applyregister" method="POST" onsubmit="return validate();">
  <p>Username: <input type="text" name="username"/></p>
  <p>Password: <input type="password" name="password"/></p>
    <p>Password again: <input type="password" name="password2"/></p>
  <p>Full name: <input type="text" name="fullname" /></p>
  <p>Email: <input type="text" name="email" /></p>

  <p></p><input type="checkbox" name="rules" value="rules"/>Accept the <a href="#">rules</a>if you want to register
  <input type="submit" value="Register">
</form>

{% if msg %}
<p> {{ msg | safe}}</p>
{% endif %}

</body>
</html>
